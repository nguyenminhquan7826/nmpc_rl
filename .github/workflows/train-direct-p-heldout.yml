name: Train Direct-P Actor NN and test unseen CAD path
on:
  push:
    branches:
      - experiment/direct-quadratic-td-critic
    paths:
      - nmpc_casadi/eval_direct_p_heldout.py
      - .github/workflows/train-direct-p-heldout.yml
  workflow_dispatch:
jobs:
  train-and-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: nmpc_casadi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install simulation requirements
        run: python -m pip install -r requirements.txt
      - name: Test direct P TD, Actor freeze and checkpoint roundtrip
        run: python -m unittest -v test_direct_p_critic
      - name: Short train and held-out evaluator integration test
        run: |
          python train_direct_p.py --mode smoke --seconds 2 --rollout-steps 1 --seed 0 --output direct_results/ci_smoke
          python eval_direct_p_heldout.py --checkpoint direct_results/ci_smoke/checkpoint.npz --seconds 2 --nominal-only --output direct_results/ci_heldout_smoke
      - name: Train Actor NN and six Critic P parameters (20 episodes; seed 0)
        run: |
          python train_direct_p.py --mode train --train-component both --episodes 20 --seconds 120 --rollout-steps 1 --seed 0 --actor-lr 0.001 --critic-lr 0.001 --output direct_results/heldout_train_seed0 | tee direct_p_train.log
      - name: Evaluate entirely unseen S-bend reference (4 plant conditions)
        run: |
          python eval_direct_p_heldout.py --checkpoint direct_results/heldout_train_seed0/checkpoint.npz --seconds 120 --seed 0 --output direct_results/heldout_eval_seed0 | tee direct_p_heldout.log
      - name: Print main comparison and training endpoint
        run: |
          python - <<'PY'
          import pandas as pd
          t=pd.read_csv('direct_results/heldout_train_seed0/training_history.csv')
          c=pd.read_csv('direct_results/heldout_eval_seed0/comparison.csv')
          print('TRAIN_ENDPOINT_JSON='+t.tail(1).to_json(orient='records'))
          print('HELDOUT_RESULTS_TABLE')
          cols=['profile','controller','mean_cte_post_m','max_cte_post_m','rmse_heading_post_rad','return','reached_end','solver_success_pct','retry_steps']
          print(c[cols].to_string(index=False,float_format=lambda x:f'{x:.6f}'))
          for profile,g in c.groupby('profile'):
              fixed=g[g.controller=='fixed_nmpc'].iloc[0]
              actor=g[g.controller=='actor_frozen_initial_p_sampled'].iloc[0]
              frozen=g[g.controller=='direct_p_frozen_sampled'].iloc[0]
              print(f'PAIRED {profile}: fixed={fixed.mean_cte_post_m*100:.4f}cm actor_fixed_P={actor.mean_cte_post_m*100:.4f}cm actor_learned_P={frozen.mean_cte_post_m*100:.4f}cm')
          PY
      - name: Upload trained checkpoint, traces and held-out reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-p-actor-critic-seed0-heldout
          path: |
            nmpc_casadi/direct_results/heldout_train_seed0
            nmpc_casadi/direct_results/heldout_eval_seed0
            nmpc_casadi/direct_p_train.log
            nmpc_casadi/direct_p_heldout.log
          if-no-files-found: warn
          retention-days: 30
