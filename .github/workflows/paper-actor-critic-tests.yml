name: Paper RL formula tests (NMPC baseline preserved)
on:
  push:
    branches:
      - experiment/paper-aligned-actor-critic
  workflow_dispatch:
jobs:
  math-and-nmpc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nmpc_casadi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NMPC dependencies
        run: python -m pip install -r requirements.txt
      - name: Paper reward TD actor objective and admissible projection
        run: python -m unittest -v test_rl_paper_core
      - name: Independent Gaussian Actor and analytical vs numerical gradients
        run: python -m unittest -v test_gaussian_weight_actor
      - name: Six-parameter direct TD critic and NMPC weight bridge
        run: python -m unittest -v test_direct_p_critic
      - name: Approved training start and pinned TRAIN-only screening tests
        run: python -m unittest -v test_screen_training_weights
      - name: Fixed paper reward audit and one-transition joint training contract
        run: python -m unittest -v test_actor_critic_training
      - name: Finite discounted returns and bounded six-P representability audit
        run: python -m unittest -v test_critic_return_audit
      - name: Positive no-upper 6P QR regression and policy-mixture diagnostics
        run: python -m unittest -v test_positive_critic_fit
      - name: One real Actor to adaptive NMPC to plant TD0 smoke solve
        run: python -m unittest -v test_actor_critic_nmpc_integration
      - name: Frozen deterministic checkpoint evaluation including real CasADi solve
        run: python -m unittest -v test_frozen_actor_critic_eval
      - name: Existing vehicle and NMPC baseline tests
        run: python -m unittest -v test_nmpc_core
      - name: Standalone baseline NMPC still works
        run: python run_nmpc.py --seconds 1 --output results_nmpc_ci/paper_rebuild
      - name: Confirm reference results
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('results_nmpc_ci/paper_rebuild')
          for item in ('nmpc_fixed.csv','summary.json','trajectory.png'):
              assert (root/item).is_file() and (root/item).stat().st_size>0,item
          PY
